<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog App</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 20px; background: #f5f6fa; }
    h1 { text-align: center; }
    section { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    input, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { padding: 10px 18px; border: none; background: #2563eb; color: white; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #message { margin: 10px 0; font-weight: bold; }
    .blog { border-bottom: 1px solid #ddd; padding: 10px 0; }
    .blog a { color: #2563eb; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Blog Application</h1>
  <div id="message"></div>

  <section>
    <h2>Register</h2>
    <input id="registerName" placeholder="Name" />
    <input id="registerEmail" placeholder="Email" />
    <input id="registerPassword" type="password" placeholder="Password" />
    <button onclick="registerUser()">Register</button>
  </section>

  <section>
    <h2>Login</h2>
    <input id="loginEmail" placeholder="Email" />
    <input id="loginPassword" type="password" placeholder="Password" />
    <button onclick="loginUser()">Login</button>
  </section>

  <section>
    <h2>Create Blog</h2>
    <input id="blogTitle" placeholder="Blog title" />
    <textarea id="blogContent" rows="5" placeholder="Blog content"></textarea>
    <button onclick="createBlog()">Create Blog</button>
  </section>

  <section>
    <h2>All Blogs</h2>
    <button onclick="getBlogs()">Load Blogs</button>
    <div id="blogs"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
